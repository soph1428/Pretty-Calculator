<!DOCTYPE html>
<html style="width: 100%; height: 100%;">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<style>
    button {
        box-shadow: 3px 4px 0px 0px #1564ad;
        background:linear-gradient(to bottom, #79bbff 5%, #378de5 100%);
        background-color:#79bbff;
        border-radius:50px;
        border:1px solid #337bc4;
        cursor:pointer;
        font-size:25px;
        font-weight:bold;
        padding:7px 22px
    } button:hover {
        background:linear-gradient(to bottom, #378de5 5%, #79bbff 100%);
        background-color:#378de5
    } button:active {
        position:relative;
        top:1px
    } #row {
        display: flex;
        justify-content: space-around
    }
</style>
<body style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: linear-gradient(#337bc4, skyblue);">
    <div style="background-color: lightblue; border-radius: 50px; width: 375px; height: 525px;">
        <div id="answersDiv" style="text-indent: 15px; line-height: calc(.25 * 525px); font-size: 50px; background-color: grey; border-radius: 50px; width: 100%; height: 25%; overflow: auto; overflow-y: hidden"></div><br>
        <div id="row"><button id="expo">^</button><button id="(dontshow)">C</button><button id="(dontshow)">Del</button><button id="(dontshow)">=</button></div><br>
        <div id="row"><button id="sqrt">√</button><button id="1">1</button><button id="2">2</button><button id="3">3</button></div><br>
        <div id="row"><button id="/">/</button><button id="4">4</button><button id="5">5</button><button id="6">6</button></div><br>
        <div id="row"><button id="*">x</button><button id="7">7</button><button id="8">8</button><button id="9">9</button></div><br>
        <div id="row"><button id="-">-</button><button id="+">+</button><button id="0">0</button><button id=".">.</button></div><br>
        <div id="row"><button id="(">(</button><button id=")">)</button><button id="π">π</button></div>
    </div>
    <script src="calculator.js"></script>
</body>
</html>
